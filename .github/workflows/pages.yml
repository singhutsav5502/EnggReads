name: Fetch and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch feeds
        continue-on-error: true
        run: python scripts/fetch-feeds.py
      - name: Commit posts.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json
          if git diff --staged --quiet; then
            echo "No feed changes"
          else
            git commit -m "Refresh aggregated posts"
            git push
          fi
      - name: Stage site
        run: |
          mkdir _site
          cp index.html styles.css app.js favicon.svg manifest.json .nojekyll _site/
          cp -R data _site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
